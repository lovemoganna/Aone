<!DOCTYPE html><html lang="zh-CN"><head><meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://code.jquery.com https://unpkg.com https://d3js.org https://threejs.org https://cdn.plot.ly https://stackpath.bootstrapcdn.com https://maps.googleapis.com https://cdn.tailwindcss.com https://ajax.googleapis.com https://kit.fontawesome.com https://cdn.datatables.net https://maxcdn.bootstrapcdn.com https://code.highcharts.com https://tako-static-assets-production.s3.amazonaws.com https://www.youtube.com https://fonts.googleapis.com https://fonts.gstatic.com https://pfst.cf2.poecdn.net https://puc.poecdn.net https://i.imgur.com https://wikimedia.org https://*.icons8.com https://*.giphy.com https://picsum.photos https://images.unsplash.com; frame-src 'self' https://www.youtube.com https://trytako.com; child-src 'self'; manifest-src 'self'; worker-src 'self'; upgrade-insecure-requests; block-all-mixed-content;">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromptHub - 个人提示词管理中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f0f0ff',
                            100: '#e5e5ff',
                            200: '#d0d0ff',
                            300: '#b0b0ff',
                            400: '#9090ff',
                            500: '#6366f1',
                            600: '#5856eb',
                            700: '#4f46e5',
                            800: '#4338ca',
                            900: '#3730a3',
                        },
                        gray: {
                            25: '#fcfcfd',
                            50: '#f9fafb',
                            100: '#f3f4f6',
                            150: '#eef0f3',
                            200: '#e5e7eb',
                            300: '#d1d5db',
                            400: '#9ca3af',
                            500: '#6b7280',
                            600: '#4b5563',
                            700: '#374151',
                            800: '#1f2937',
                            850: '#1a202c',
                            900: '#111827',
                            950: '#0d1117',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                    },
                    boxShadow: {
                        'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.37)',
                        'soft': '0 2px 15px -3px rgba(0, 0, 0, 0.07), 0 10px 20px -2px rgba(0, 0, 0, 0.04)',
                        'medium': '0 4px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 30px -5px rgba(0, 0, 0, 0.04)',
                        'hard': '0 10px 40px -10px rgba(0, 0, 0, 0.15), 0 20px 50px -10px rgba(0, 0, 0, 0.1)',
                    },
                    backdropBlur: {
                        xs: '2px',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        /* 高端设计样式 */
        .glass-morphism {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        .dark .glass-morphism {
            background: rgba(17, 17, 27, 0.40);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        .premium-gradient {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .tag-tree-item {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 8px;
        }
        .tag-tree-item:hover {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1) 0%, rgba(139, 92, 246, 0.1) 100%);
            transform: translateX(2px);
        }
        
        .prompt-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(229, 231, 235, 0.8);
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 12px;
        }
        .prompt-card:hover {
            border-color: rgba(99, 102, 241, 0.3);
            box-shadow: 0 8px 25px -5px rgba(99, 102, 241, 0.1), 0 10px 10px -5px rgba(99, 102, 241, 0.04);
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.9);
        }
        .dark .prompt-card {
            border-color: rgba(55, 65, 81, 0.8);
            background: rgba(31, 41, 55, 0.7);
        }
        .dark .prompt-card:hover {
            border-color: rgba(99, 102, 241, 0.3);
            background: rgba(31, 41, 55, 0.9);
        }
        
        /* 网格布局样式 */
        .grid-layout {
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        }
        .compact-layout {
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        }
        
        .compact-card {
            min-height: 120px;
        }
        .compact-card .card-title {
            font-size: 0.875rem;
            line-height: 1.25rem;
            margin-bottom: 0.5rem;
        }
        .compact-card .card-preview {
            font-size: 0.75rem;
            line-height: 1rem;
            margin-bottom: 0.5rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .compact-card .card-meta {
            font-size: 0.6875rem;
        }
        
        .variable-highlight {
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            color: #92400e;
            padding: 2px 6px;
            border-radius: 6px;
            font-weight: 500;
            font-size: 0.875em;
        }
        .dark .variable-highlight {
            background: linear-gradient(135deg, #451a03 0%, #78350f 100%);
            color: #fbbf24;
        }
        
        /* 按钮增强样式 */
        .btn-primary {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 14px 0 rgba(99, 102, 241, 0.25);
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 25px 0 rgba(99, 102, 241, 0.35);
        }
        
        .btn-secondary {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(209, 213, 219, 0.8);
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(8px);
        }
        .btn-secondary:hover {
            transform: translateY(-1px);
            border-color: rgba(99, 102, 241, 0.3);
            box-shadow: 0 4px 14px 0 rgba(99, 102, 241, 0.1);
        }
        .dark .btn-secondary {
            border-color: rgba(75, 85, 99, 0.8);
            background: rgba(31, 41, 55, 0.8);
        }
        .dark .btn-secondary:hover {
            border-color: rgba(99, 102, 241, 0.3);
        }
        
        /* 输入框增强样式 */
        .form-input {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(209, 213, 219, 0.8);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
        }
        .form-input:focus {
            ring: 2px solid rgba(99, 102, 241, 0.2);
            border-color: rgba(99, 102, 241, 0.5);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }
        .dark .form-input {
            border-color: rgba(75, 85, 99, 0.8);
            background: rgba(31, 41, 55, 0.9);
        }
        
        /* 侧边栏增强 */
        .sidebar {
            background: linear-gradient(180deg, rgba(249, 250, 251, 0.95) 0%, rgba(243, 244, 246, 0.95) 100%);
            backdrop-filter: blur(12px);
        }
        .dark .sidebar {
            background: linear-gradient(180deg, rgba(31, 41, 55, 0.95) 0%, rgba(17, 24, 39, 0.95) 100%);
        }
        
        /* 模态框增强 */
        .modal-backdrop {
            backdrop-filter: blur(8px);
            background: rgba(0, 0, 0, 0.4);
        }
        
        /* 滚动条样式 */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(243, 244, 246, 0.5);
            border-radius: 3px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.7);
            border-radius: 3px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(107, 114, 128, 0.8);
        }
        .dark .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(55, 65, 81, 0.5);
        }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(107, 114, 128, 0.7);
        }
        
        /* 标签样式增强 */
        .tag-chip {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            transition: all 0.2s ease;
        }
        .tag-chip:hover {
            transform: scale(1.05);
        }
        
        .tag-display {
            background: linear-gradient(135deg, rgba(243, 244, 246, 0.8) 0%, rgba(229, 231, 235, 0.8) 100%);
            transition: all 0.2s ease;
        }
        .dark .tag-display {
            background: linear-gradient(135deg, rgba(55, 65, 81, 0.8) 0%, rgba(75, 85, 99, 0.8) 100%);
        }
        
        /* 动画效果 */
        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .animate-slide-up {
            animation: slideInUp 0.3s ease-out;
        }
        
        /* 活跃状态 */
        .quick-filter.active {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1) 0%, rgba(139, 92, 246, 0.1) 100%);
            border-left: 3px solid #6366f1;
            transform: translateX(2px);
        }
        
        /* Markdown 渲染样式 */
        .markdown-content {
            line-height: 1.6;
        }
        .markdown-content h1, .markdown-content h2, .markdown-content h3, 
        .markdown-content h4, .markdown-content h5, .markdown-content h6 {
            font-weight: 600;
            margin-top: 1.5em;
            margin-bottom: 0.5em;
            color: inherit;
        }
        .markdown-content h1 { font-size: 1.5em; }
        .markdown-content h2 { font-size: 1.3em; }
        .markdown-content h3 { font-size: 1.1em; }
        .markdown-content p {
            margin-bottom: 1em;
        }
        .markdown-content ul, .markdown-content ol {
            margin-bottom: 1em;
            padding-left: 1.5em;
        }
        .markdown-content li {
            margin-bottom: 0.25em;
        }
        .markdown-content code {
            background-color: #f3f4f6;
            color: #374151;
            padding: 0.125rem 0.25rem;
            border-radius: 0.25rem;
            font-size: 0.875em;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
        }
        .dark .markdown-content code {
            background-color: #374151;
            color: #f3f4f6;
        }
        .markdown-content pre {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 1em;
            overflow-x: auto;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
        }
        .dark .markdown-content pre {
            background-color: #1f2937;
            border-color: #374151;
        }
        .markdown-content pre code {
            background: none;
            padding: 0;
            font-size: inherit;
        }
        .markdown-content blockquote {
            border-left: 4px solid #5d5cde;
            padding-left: 1rem;
            margin: 1em 0;
            font-style: italic;
            color: #6b7280;
        }
        .dark .markdown-content blockquote {
            color: #9ca3af;
        }
        .markdown-content strong {
            font-weight: 600;
        }
        .markdown-content em {
            font-style: italic;
        }
        .markdown-content a {
            color: #5d5cde;
            text-decoration: underline;
        }
        .markdown-content a:hover {
            color: #4c4bcf;
        }
    </style>
</head>
<body class="bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100">
    <!-- 主容器 -->
    <div id="app" class="flex h-screen overflow-hidden">
        <!-- 左侧栏 - 导航和标签树 -->
        <div class="w-80 bg-gray-50 dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 flex flex-col">
            <!-- 标题栏 -->
            <div class="p-6 border-b border-gray-200 dark:border-gray-700">
                <div class="flex items-center justify-between">
                    <div>
                        <h1 class="text-2xl font-bold text-primary flex items-center gap-2">
                            <i data-lucide="brain-circuit"></i>
                            PromptHub
                        </h1>
                        <p class="text-sm text-gray-600 dark:text-gray-400 mt-1">个人提示词管理中心</p>
                    </div>
                    <button id="themeToggle" class="p-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors" title="切换主题">
                        <i data-lucide="sun" class="w-5 h-5 dark:hidden"></i>
                        <i data-lucide="moon" class="w-5 h-5 hidden dark:block"></i>
                    </button>
                </div>
            </div>

            <!-- 搜索框 -->
            <div class="p-4 border-b border-gray-200 dark:border-gray-700">
                <div class="relative">
                    <i data-lucide="search" class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 w-4 h-4"></i>
                    <input type="text" id="searchInput" placeholder="搜索提示词..." class="w-full pl-10 pr-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent bg-white dark:bg-gray-700 text-base">
                </div>
            </div>

            <!-- 快捷入口 -->
            <div class="p-4 border-b border-gray-200 dark:border-gray-700">
                <h3 class="text-sm font-medium text-gray-700 dark:text-gray-300 mb-3">快捷入口</h3>
                <div class="space-y-1">
                    <button class="quick-filter w-full text-left px-3 py-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 flex items-center gap-2 text-sm" data-filter="recent">
                        <i data-lucide="clock" class="w-4 h-4"></i>
                        最近使用
                    </button>
                    <button class="quick-filter w-full text-left px-3 py-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 flex items-center gap-2 text-sm" data-filter="favorites">
                        <i data-lucide="star" class="w-4 h-4"></i>
                        收藏夹
                    </button>
                    <button class="quick-filter w-full text-left px-3 py-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 flex items-center gap-2 text-sm" data-filter="untagged">
                        <i data-lucide="help-circle" class="w-4 h-4"></i>
                        未分类
                    </button>
                </div>
            </div>

            <!-- 标签树 -->
            <div class="flex-1 overflow-y-auto p-4">
                <div class="flex items-center justify-between mb-3">
                    <h3 class="text-sm font-medium text-gray-700 dark:text-gray-300">标签管理</h3>
                    <button id="addTagBtn" class="p-1 rounded hover:bg-gray-200 dark:hover:bg-gray-700" title="添加标签">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                    </button>
                </div>
                <div id="tagTree" class="space-y-1"></div>
            </div>
        </div>

        <!-- 中间栏 - 提示词列表 -->
        <div class="flex-1 flex flex-col min-w-0">
            <!-- 工具栏 -->
            <div class="p-4 border-b border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <button id="addPromptBtn" class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-primary-hover flex items-center gap-2">
                            <i data-lucide="plus" class="w-4 h-4"></i>
                            新建提示词
                        </button>
                        <div class="flex items-center gap-2">
                            <button id="exportBtn" class="px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 flex items-center gap-2 text-sm" title="导出数据">
                                <i data-lucide="download" class="w-4 h-4"></i>
                                导出
                            </button>
                            <button id="importBtn" class="px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 flex items-center gap-2 text-sm" title="导入数据">
                                <i data-lucide="upload" class="w-4 h-4"></i>
                                导入
                            </button>
                            <input type="file" id="importFileInput" accept=".json" class="hidden">
                        </div>
                        <select id="sortSelect" class="px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-sm">
                            <option value="updated">按更新时间</option>
                            <option value="created">按创建时间</option>
                            <option value="usage">按使用频率</option>
                            <option value="title">按标题A-Z</option>
                        </select>
                    </div>
                    <div class="flex items-center gap-2">
                        <span id="promptCount" class="text-sm text-gray-600 dark:text-gray-400">0 个提示词</span>
                        <button id="viewToggle" class="p-2 rounded hover:bg-gray-100 dark:hover:bg-gray-800" title="切换视图">
                            <i data-lucide="layout-grid" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 提示词列表 -->
            <div class="flex-1 overflow-y-auto p-4 custom-scrollbar">
                <div id="promptList" class="grid gap-4 grid-layout"></div>
                <div id="emptyState" class="hidden text-center py-12">
                    <i data-lucide="file-text" class="w-16 h-16 text-gray-300 dark:text-gray-600 mx-auto mb-4"></i>
                    <h3 class="text-lg font-medium text-gray-600 dark:text-gray-400 mb-2">还没有提示词</h3>
                    <p class="text-gray-500 dark:text-gray-500 mb-4">开始创建你的第一个提示词吧！</p>
                    <button class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-primary-hover" onclick="openPromptModal()">
                        创建提示词
                    </button>
                </div>
            </div>
        </div>

        <!-- 右侧栏 - 详情面板 -->
        <div id="rightPanel" class="w-96 bg-gray-50 dark:bg-gray-800 border-l border-gray-200 dark:border-gray-700 hidden">
            <div class="h-full overflow-y-auto" id="promptDetail"></div>
        </div>
    </div>

    <!-- 提示词编辑模态框 -->
    <div id="promptModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-800 rounded-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
            <div class="p-6 border-b border-gray-200 dark:border-gray-700">
                <h2 id="modalTitle" class="text-xl font-semibold">新建提示词</h2>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-2">标题 *</label>
                    <input type="text" id="promptTitle" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent bg-white dark:bg-gray-700 text-base" placeholder="输入提示词标题">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">内容 *</label>
                    <div class="border border-gray-300 dark:border-gray-600 rounded-lg overflow-hidden">
                        <div class="flex border-b border-gray-300 dark:border-gray-600">
                            <button type="button" id="editTab" class="px-4 py-2 text-sm font-medium text-primary border-b-2 border-primary bg-gray-50 dark:bg-gray-700">编辑</button>
                            <button type="button" id="previewTab" class="px-4 py-2 text-sm font-medium text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-gray-200">预览</button>
                        </div>
                        <div id="editPanel">
                            <textarea id="promptContent" rows="8" class="w-full px-3 py-2 border-0 focus:ring-0 bg-white dark:bg-gray-700 text-base resize-none" placeholder="输入提示词内容...支持Markdown格式和模板变量如 {{主题}}"></textarea>
                        </div>
                        <div id="previewPanel" class="hidden p-4 bg-gray-50 dark:bg-gray-900 min-h-[200px]">
                            <div id="markdownPreview" class="markdown-content text-sm"></div>
                        </div>
                    </div>
                    <p class="text-xs text-gray-500 mt-1">支持Markdown格式和 {{变量名}} 模板语法</p>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">标签</label>
                    <div class="space-y-2">
                        <div id="selectedTags" class="flex flex-wrap gap-2"></div>
                        <button type="button" id="addTagToPrompt" class="text-primary hover:text-primary-hover text-sm flex items-center gap-1">
                            <i data-lucide="plus" class="w-3 h-3"></i>
                            添加标签
                        </button>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">描述</label>
                    <input type="text" id="promptDescription" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent bg-white dark:bg-gray-700 text-base" placeholder="可选：添加简短描述">
                </div>
                <div class="flex items-center gap-2">
                    <input type="checkbox" id="promptFavorite" class="w-4 h-4 text-primary border-gray-300 rounded focus:ring-primary">
                    <label for="promptFavorite" class="text-sm">添加到收藏夹</label>
                </div>
            </div>
            <div class="p-6 border-t border-gray-200 dark:border-gray-700 flex justify-end gap-3">
                <button type="button" id="cancelPromptBtn" class="px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700">取消</button>
                <button type="button" id="savePromptBtn" class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-primary-hover">保存</button>
            </div>
        </div>
    </div>

    <!-- 标签编辑模态框 -->
    <div id="tagModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-800 rounded-xl max-w-md w-full">
            <div class="p-6 border-b border-gray-200 dark:border-gray-700">
