    <script>
        // 应用状态
        let app = {
            prompts: [],
            tags: [],
            selectedPrompt: null,
            currentFilter: 'all',
            searchTerm: '',
            sortBy: 'updated',
            editingPrompt: null,
            editingTag: null,
            viewMode: 'grid', // 'grid' 或 'compact'
            collapsedTags: new Set(), // 存储折叠状态的标签ID
            selectedPrompts: new Set(), // 批量选择的提示词ID
            searchTimeout: null, // 搜索防抖
            isLoading: false, // 加载状态
            theme: 'auto' // 'light', 'dark', 'auto'
        };

        // 初始化应用
        function initApp() {
            // 设置深色模式
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.classList.add('dark');
            }
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', event => {
                if (event.matches) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            });

            // 初始化Lucide图标
            lucide.createIcons();

            // 初始化主题
            initTheme();

            // 加载数据
            loadData();

            // 绑定事件
            bindEvents();

            // 渲染界面
            renderTagTree();
            renderPromptList();

            // 显示快捷键提示
            setTimeout(() => {
                showKeyboardShortcuts();
            }, 2000);
        }

        // 数据持久化
        function saveData() {
            try {
                const data = {
                    prompts: app.prompts,
                    tags: app.tags,
                    version: '1.0'
                };
                localStorage.setItem('prompthub_data', JSON.stringify(data));
            } catch (error) {
                console.error('保存数据失败:', error);
            }
        }

        function loadData() {
            try {
                const data = localStorage.getItem('prompthub_data');
                if (data) {
                    const parsed = JSON.parse(data);
                    app.prompts = parsed.prompts || [];
                    app.tags = parsed.tags || [];
                } else {
                    // 初始化示例数据
                    initSampleData();
                }
            } catch (error) {
                console.error('加载数据失败:', error);
                initSampleData();
            }
        }

        function initSampleData() {
            // 创建示例标签
            app.tags = [
                { id: 'work', name: '工作', parentId: null, level: 0 },
                { id: 'work-writing', name: '文案写作', parentId: 'work', level: 1 },
                { id: 'work-coding', name: '编程开发', parentId: 'work', level: 1 },
                { id: 'work-coding-debug', name: '调试优化', parentId: 'work-coding', level: 2 },
                { id: 'personal', name: '个人', parentId: null, level: 0 },
                { id: 'personal-learning', name: '学习研究', parentId: 'personal', level: 1 }
            ];

            // 默认折叠有子标签的父级标签
            app.tags.forEach(tag => {
                const hasChildren = app.tags.some(t => t.parentId === tag.id);
                if (hasChildren) {
                    app.collapsedTags.add(tag.id);
                }
            });

            // 创建示例提示词
            app.prompts = [
                {
                    id: 'p1',
                    title: '产品文案撰写助手',
                    content: '你是一位专业的产品文案撰写专家。请为**{{产品名称}}**撰写吸引人的文案，目标用户是{{目标用户}}，重点突出{{核心卖点}}。\n\n## 文案要求\n- 风格：{{风格要求}}\n- 字数：适中，突出重点\n- 调性：专业而有感染力\n\n请按以下结构输出：\n1. **主标题**\n2. **副标题** \n3. **核心卖点**（3-5个）\n4. **行动号召**',
                    description: '适用于各类产品的营销文案创作，支持Markdown格式',
                    tags: ['work', 'work-writing'],
                    favorite: true,
                    createdAt: Date.now() - 86400000,
                    updatedAt: Date.now() - 86400000,
                    usageCount: 15
                },
                {
                    id: 'p2',
                    title: '代码调试分析',
                    content: '请帮我分析以下代码中可能存在的问题：\n\n```{{编程语言}}\n{{代码内容}}\n```\n\n**编程语言：** {{编程语言}}\n**期望功能：** {{期望功能}}\n\n## 分析要求\n请提供以下内容：\n\n### 1. 问题诊断\n- 语法错误\n- 逻辑错误  \n- 性能问题\n- 安全隐患\n\n### 2. 修复建议\n- 具体的修改方案\n- 代码示例\n- 最佳实践建议\n\n### 3. 优化建议\n- 性能优化\n- 代码规范\n- 可维护性改进',
                    description: '用于代码问题诊断和优化建议，支持多种编程语言',
                    tags: ['work', 'work-coding', 'work-coding-debug'],
                    favorite: false,
                    createdAt: Date.now() - 3600000,
                    updatedAt: Date.now() - 3600000,
                    usageCount: 8
                },
                {
                    id: 'p3',
                    title: '学习笔记整理',
                    content: '请帮我整理关于**{{学习主题}}**的学习笔记。\n\n## 原始内容\n{{原始笔记内容}}\n\n## 整理要求\n请按以下结构重新组织内容：\n\n### 📋 核心概念\n> 提取关键概念和定义\n\n### 🔍 重点内容\n- **要点1：** 详细说明\n- **要点2：** 详细说明\n- **要点3：** 详细说明\n\n### 💡 实践应用\n具体的应用场景和例子\n\n### ❓ 疑问点\n需要进一步学习的内容\n\n### 🔗 相关资源\n推荐的学习资料',
                    description: '将杂乱的学习内容整理成结构化的笔记',
                    tags: ['personal', 'personal-learning'],
                    favorite: true,
                    createdAt: Date.now() - 7200000,
                    updatedAt: Date.now() - 7200000,
                    usageCount: 12
                }
            ];

            saveData();
        }

        // 事件绑定
        function bindEvents() {
            // 搜索功能
            document.getElementById('searchInput').addEventListener('input', (e) => {
                app.searchTerm = e.target.value;
                renderPromptList();
            });

            // 排序功能
            document.getElementById('sortSelect').addEventListener('change', (e) => {
                app.sortBy = e.target.value;
                renderPromptList();
            });

            // 快捷筛选
            document.querySelectorAll('.quick-filter').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    app.currentFilter = e.currentTarget.dataset.filter;
                    document.querySelectorAll('.quick-filter').forEach(b => b.classList.remove('bg-gray-200', 'dark:bg-gray-700'));
                    e.currentTarget.classList.add('bg-gray-200', 'dark:bg-gray-700');
                    renderPromptList();
                });
            });

            // 模态框控制
            document.getElementById('addPromptBtn').addEventListener('click', () => openPromptModal());
            document.getElementById('addTagBtn').addEventListener('click', () => openTagModal());
            document.getElementById('cancelPromptBtn').addEventListener('click', () => closePromptModal());
            document.getElementById('cancelTagBtn').addEventListener('click', () => closeTagModal());
            document.getElementById('cancelVariableBtn').addEventListener('click', () => closeVariableModal());

            // 保存按钮
            document.getElementById('savePromptBtn').addEventListener('click', savePrompt);
            document.getElementById('saveTagBtn').addEventListener('click', saveTag);
            document.getElementById('applyVariableBtn').addEventListener('click', applyVariables);

            // 添加标签到提示词
            document.getElementById('addTagToPrompt').addEventListener('click', () => {
                showTagSelector();
            });

            // 编辑/预览切换
            document.getElementById('editTab').addEventListener('click', () => {
                showEditPanel();
            });
            document.getElementById('previewTab').addEventListener('click', () => {
                showPreviewPanel();
            });

            // 内容变化时更新预览
            document.getElementById('promptContent').addEventListener('input', () => {
                updateMarkdownPreview();
            });

            // 导入导出功能
            document.getElementById('exportBtn').addEventListener('click', () => openExportModal());
            document.getElementById('importBtn').addEventListener('click', () => openImportModal());
            document.getElementById('cancelExportBtn').addEventListener('click', () => closeExportModal());
            document.getElementById('cancelImportBtn').addEventListener('click', () => closeImportModal());
            document.getElementById('confirmExportBtn').addEventListener('click', () => performExport());
            document.getElementById('confirmImportBtn').addEventListener('click', () => performImport());
            
            // 文件选择
            document.getElementById('selectFileBtn').addEventListener('click', () => {
                document.getElementById('importFileInput').click();
            });
            document.getElementById('importFileInput').addEventListener('change', handleFileSelect);
            document.getElementById('removeFileBtn').addEventListener('click', () => {
                clearSelectedFile();
            });

            // 视图切换
            document.getElementById('viewToggle').addEventListener('click', () => {
                toggleViewMode();
            });

            // 深色模式切换
            document.getElementById('themeToggle').addEventListener('click', () => {
                toggleTheme();
            });

            // 快捷键支持
            document.addEventListener('keydown', handleKeyboardShortcuts);

            // 搜索防抖优化
            document.getElementById('searchInput').removeEventListener('input', app.originalSearchHandler);
            document.getElementById('searchInput').addEventListener('input', (e) => {
                clearTimeout(app.searchTimeout);
                app.searchTimeout = setTimeout(() => {
                    app.searchTerm = e.target.value;
                    renderPromptList();
                }, 300);
            });
        }

        // 标签树渲染
        function renderTagTree() {
            const container = document.getElementById('tagTree');
            container.innerHTML = '';

            function renderTag(tag, level = 0) {
                const hasChildren = app.tags.some(t => t.parentId === tag.id);
                const isCollapsed = app.collapsedTags.has(tag.id);
                const promptCount = getPromptCountForTag(tag.id);

                const div = document.createElement('div');
                div.className = 'tag-tree-node';
                
                // 标签项容器
                const tagItem = document.createElement('div');
                tagItem.className = `tag-tree-item pl-${level * 4} pr-2 py-1 rounded-lg cursor-pointer flex items-center justify-between group`;
                
                tagItem.innerHTML = `
                    <div class="flex items-center gap-2 flex-1" onclick="selectTag('${tag.id}')">
                        ${hasChildren ? 
                            `<button onclick="event.stopPropagation(); toggleTagCollapse('${tag.id}')" class="p-0.5 hover:bg-gray-200 dark:hover:bg-gray-600 rounded">
                                <i data-lucide="${isCollapsed ? 'chevron-right' : 'chevron-down'}" class="w-3 h-3 text-gray-400"></i>
                            </button>` : 
                            '<div class="w-4"></div>'
                        }
                        <i data-lucide="tag" class="w-3 h-3 text-gray-400"></i>
                        <span class="text-sm">${tag.name}</span>
                        <span class="text-xs text-gray-400">(${promptCount})</span>
                    </div>
                    <div class="opacity-0 group-hover:opacity-100 flex items-center gap-1">
                        <button onclick="editTag('${tag.id}')" class="p-1 hover:bg-gray-200 dark:hover:bg-gray-600 rounded" title="编辑标签">
                            <i data-lucide="edit-2" class="w-3 h-3"></i>
                        </button>
                        <button onclick="deleteTag('${tag.id}')" class="p-1 hover:bg-gray-200 dark:hover:bg-gray-600 rounded" title="删除标签">
                            <i data-lucide="trash-2" class="w-3 h-3"></i>
                        </button>
                    </div>
                `;

                div.appendChild(tagItem);

                // 子标签容器
                if (hasChildren) {
                    const childrenContainer = document.createElement('div');
                    childrenContainer.className = `tag-children ${isCollapsed ? 'hidden' : ''}`;
                    
                    // 渲染子标签
                    const children = app.tags.filter(t => t.parentId === tag.id);
                    children.forEach(child => {
                        const childNode = renderTag(child, level + 1);
                        childrenContainer.appendChild(childNode);
                    });
                    
                    div.appendChild(childrenContainer);
                }

                return div;
            }

            // 渲染顶级标签
            const rootTags = app.tags.filter(t => !t.parentId);
            rootTags.forEach(tag => {
                const tagNode = renderTag(tag);
                container.appendChild(tagNode);
            });

            lucide.createIcons();
        }

        // 切换标签折叠状态
        function toggleTagCollapse(tagId) {
            if (app.collapsedTags.has(tagId)) {
                app.collapsedTags.delete(tagId);
            } else {
                app.collapsedTags.add(tagId);
            }
            renderTagTree();
        }

        // 获取标签下的提示词数量
        function getPromptCountForTag(tagId) {
            return app.prompts.filter(p => p.tags.includes(tagId)).length;
        }

        // 选择标签筛选
        function selectTag(tagId) {
            app.currentFilter = `tag:${tagId}`;
            renderPromptList();
        }

        // 提示词列表渲染
        function renderPromptList() {
            const container = document.getElementById('promptList');
            const emptyState = document.getElementById('emptyState');
            const promptCount = document.getElementById('promptCount');

            let filteredPrompts = filterPrompts();
            filteredPrompts = sortPrompts(filteredPrompts);

            if (filteredPrompts.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
                promptCount.textContent = '0 个提示词';
                return;
            }

            emptyState.classList.add('hidden');
            promptCount.textContent = `${filteredPrompts.length} 个提示词`;

            container.innerHTML = filteredPrompts.map(prompt => createPromptCard(prompt)).join('');
            lucide.createIcons();
        }

        // 筛选提示词
        function filterPrompts() {
            let filtered = [...app.prompts];

            // 搜索筛选
            if (app.searchTerm) {
                const term = app.searchTerm.toLowerCase();
                filtered = filtered.filter(p => 
                    p.title.toLowerCase().includes(term) ||
                    p.content.toLowerCase().includes(term) ||
                    p.description?.toLowerCase().includes(term)
                );
            }

            // 快捷筛选
            switch (app.currentFilter) {
                case 'recent':
                    filtered = filtered.filter(p => p.usageCount > 0).slice(0, 10);
                    break;
                case 'favorites':
                    filtered = filtered.filter(p => p.favorite);
                    break;
                case 'untagged':
                    filtered = filtered.filter(p => !p.tags || p.tags.length === 0);
                    break;
                default:
                    if (app.currentFilter.startsWith('tag:')) {
                        const tagId = app.currentFilter.replace('tag:', '');
                        filtered = filtered.filter(p => p.tags && p.tags.includes(tagId));
                    }
            }

            return filtered;
        }

        // 排序提示词
        function sortPrompts(prompts) {
            return prompts.sort((a, b) => {
                switch (app.sortBy) {
                    case 'created':
                        return b.createdAt - a.createdAt;
                    case 'updated':
                        return b.updatedAt - a.updatedAt;
                    case 'usage':
                        return b.usageCount - a.usageCount;
                    case 'title':
                        return a.title.localeCompare(b.title);
                    default:
                        return b.updatedAt - a.updatedAt;
                }
            });
        }

        // 创建提示词卡片
        function createPromptCard(prompt) {
            const tagNames = prompt.tags ? prompt.tags.map(tagId => {
                const tag = app.tags.find(t => t.id === tagId);
                return tag ? tag.name : '';
            }).filter(Boolean) : [];

            const preview = app.viewMode === 'compact' 
                ? (prompt.content.length > 60 ? prompt.content.substring(0, 60) + '...' : prompt.content)
                : (prompt.content.length > 100 ? prompt.content.substring(0, 100) + '...' : prompt.content);

            const variables = extractVariables(prompt.content);
            const hasVariables = variables.length > 0;

            const compactClass = app.viewMode === 'compact' ? 'compact-card' : '';
            
            return `
                <div class="prompt-card ${compactClass} bg-white dark:bg-gray-800 rounded-xl p-4 cursor-pointer animate-slide-up" onclick="selectPrompt('${prompt.id}')">
                    <div class="flex items-start justify-between mb-3">
                        <h3 class="card-title font-semibold text-gray-900 dark:text-gray-100 flex-1 mr-2">${prompt.title}</h3>
                        <div class="flex items-center gap-1.5">
                            ${prompt.favorite ? '<i data-lucide="star" class="w-4 h-4 text-amber-500 fill-current"></i>' : ''}
                            <button onclick="event.stopPropagation(); ${hasVariables ? `copyWithVariables('${prompt.id}')` : `copyPrompt('${prompt.id}')`}" class="p-1.5 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition-colors" title="复制">
                                <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                            </button>
                        </div>
                    </div>
                    <p class="card-preview text-sm text-gray-600 dark:text-gray-400 mb-3">${highlightVariables(preview)}</p>
                    <div class="flex items-center justify-between">
                        <div class="flex flex-wrap gap-1.5">
                            ${tagNames.map(name => `<span class="tag-display px-2 py-1 text-xs rounded-full font-medium text-gray-700 dark:text-gray-300">${name}</span>`).join('')}
                        </div>
                        <div class="card-meta flex items-center gap-2 text-xs text-gray-500 dark:text-gray-400">
                            <span class="flex items-center gap-1">
                                <i data-lucide="clock" class="w-3 h-3"></i>
                                ${formatDate(prompt.updatedAt)}
                            </span>
                            <span class="flex items-center gap-1">
                                <i data-lucide="mouse-pointer-click" class="w-3 h-3"></i>
                                ${prompt.usageCount || 0}
                            </span>
                        </div>
                    </div>
                </div>
            `;
        }

        // 提取变量
        function extractVariables(content) {
            const matches = content.match(/\{\{([^}]+)\}\}/g);
            return matches ? [...new Set(matches.map(m => m.slice(2, -2).trim()))] : [];
        }

        // 高亮变量
        function highlightVariables(content) {
            return content.replace(/\{\{([^}]+)\}\}/g, '<span class="variable-highlight">{{$1}}</span>');
        }

        // 格式化日期
        function formatDate(timestamp) {
            const date = new Date(timestamp);
            const now = new Date();
            const diff = now - date;
            
            if (diff < 3600000) { // 1小时内
                return Math.floor(diff / 60000) + '分钟前';
            } else if (diff < 86400000) { // 24小时内
                return Math.floor(diff / 3600000) + '小时前';
            } else {
                return date.toLocaleDateString();
            }
        }

        // 选择提示词
        function selectPrompt(promptId) {
            app.selectedPrompt = promptId;
            const prompt = app.prompts.find(p => p.id === promptId);
            if (prompt) {
                showPromptDetail(prompt);
            }
        }

        // 显示提示词详情
        function showPromptDetail(prompt) {
            const panel = document.getElementById('rightPanel');
            const detail = document.getElementById('promptDetail');
            
            const tagNames = prompt.tags ? prompt.tags.map(tagId => {
                const tag = app.tags.find(t => t.id === tagId);
                return tag ? tag.name : '';
            }).filter(Boolean) : [];

            const variables = extractVariables(prompt.content);
            const hasVariables = variables.length > 0;

            detail.innerHTML = `
                <div class="p-6">
                    <div class="flex items-start justify-between mb-4">
                        <h2 class="text-xl font-semibold text-gray-900 dark:text-gray-100 flex-1 mr-4">${prompt.title}</h2>
                        <button onclick="closePromptDetail()" class="p-2 hover:bg-gray-200 dark:hover:bg-gray-700 rounded-lg">
                            <i data-lucide="x" class="w-5 h-5"></i>
                        </button>
                    </div>
                    
                    ${prompt.description ? `<p class="text-gray-600 dark:text-gray-400 mb-4">${prompt.description}</p>` : ''}
                    
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">提示词内容</label>
                        <div class="bg-gray-50 dark:bg-gray-900 rounded-lg p-4 border border-gray-200 dark:border-gray-600">
                            <div class="markdown-content text-sm text-gray-800 dark:text-gray-200">${renderMarkdownContent(prompt.content)}</div>
                        </div>
                    </div>

                    ${variables.length > 0 ? `
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">模板变量</label>
                        <div class="flex flex-wrap gap-2">
                            ${variables.map(v => `<span class="px-2 py-1 bg-blue-100 dark:bg-blue-900 text-blue-800 dark:text-blue-200 text-xs rounded-full">${v}</span>`).join('')}
                        </div>
                    </div>
                    ` : ''}

                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">标签</label>
                        <div class="flex flex-wrap gap-2">
                            ${tagNames.map(name => `<span class="px-2 py-1 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 text-xs rounded-full">${name}</span>`).join('')}
                        </div>
                    </div>

                    <div class="mb-6">
                        <div class="grid grid-cols-2 gap-4 text-sm text-gray-600 dark:text-gray-400">
                            <div>
                                <span class="font-medium">创建时间:</span><br>
                                ${new Date(prompt.createdAt).toLocaleString()}
                            </div>
                            <div>
                                <span class="font-medium">更新时间:</span><br>
                                ${new Date(prompt.updatedAt).toLocaleString()}
                            </div>
                            <div>
                                <span class="font-medium">使用次数:</span><br>
                                ${prompt.usageCount || 0} 次
                            </div>
                            <div>
                                <span class="font-medium">收藏状态:</span><br>
                                ${prompt.favorite ? '已收藏' : '未收藏'}
                            </div>
                        </div>
                    </div>

                    <div class="flex gap-3">
                        <button onclick="${hasVariables ? `copyWithVariables('${prompt.id}')` : `copyPrompt('${prompt.id}')`}" class="flex-1 px-4 py-2 bg-primary text-white rounded-lg hover:bg-primary-hover flex items-center justify-center gap-2">
                            <i data-lucide="copy" class="w-4 h-4"></i>
                            ${hasVariables ? '复制并填入变量' : '复制内容'}
                        </button>
                        <button onclick="editPrompt('${prompt.id}')" class="px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 flex items-center gap-2">
                            <i data-lucide="edit-2" class="w-4 h-4"></i>
                            编辑
                        </button>
                        <button onclick="deletePrompt('${prompt.id}')" class="px-4 py-2 text-red-600 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-lg flex items-center gap-2">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                            删除
                        </button>
                    </div>
                </div>
            `;

            panel.classList.remove('hidden');
            lucide.createIcons();
        }

        // 关闭详情面板
        function closePromptDetail() {
            document.getElementById('rightPanel').classList.add('hidden');
            app.selectedPrompt = null;
        }

        // 复制提示词（无变量）
        function copyPrompt(promptId) {
            const prompt = app.prompts.find(p => p.id === promptId);
            if (prompt) {
                navigator.clipboard.writeText(prompt.content).then(() => {
                    // 增加使用次数
                    prompt.usageCount = (prompt.usageCount || 0) + 1;
                    prompt.updatedAt = Date.now();
                    saveData();
                    renderPromptList();
                    if (app.selectedPrompt === promptId) {
                        showPromptDetail(prompt);
                    }
                    showToast('内容已复制到剪贴板');
                });
            }
        }

        // 复制提示词（含变量）
        function copyWithVariables(promptId) {
            const prompt = app.prompts.find(p => p.id === promptId);
            if (!prompt) return;

            const variables = extractVariables(prompt.content);
            if (variables.length === 0) {
                copyPrompt(promptId);
                return;
            }

            showVariableModal(prompt, variables);
        }

        // 显示变量输入模态框
        function showVariableModal(prompt, variables) {
            const modal = document.getElementById('variableModal');
            const inputs = document.getElementById('variableInputs');
            
            inputs.innerHTML = variables.map(variable => `
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">${variable}</label>
                    <input type="text" data-variable="${variable}" class="variable-input w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent bg-white dark:bg-gray-700 text-base" placeholder="请输入${variable}的值">
                </div>
            `).join('');

            modal.classList.remove('hidden');
            modal.dataset.promptId = prompt.id;
        }

        // 应用变量并复制
        function applyVariables() {
            const modal = document.getElementById('variableModal');
            const promptId = modal.dataset.promptId;
            const prompt = app.prompts.find(p => p.id === promptId);
            
            if (!prompt) return;

            let content = prompt.content;
            const inputs = document.querySelectorAll('.variable-input');
            
            inputs.forEach(input => {
                const variable = input.dataset.variable;
                const value = input.value.trim();
                if (value) {
                    content = content.replace(new RegExp(`\\{\\{${variable}\\}\\}`, 'g'), value);
                }
            });

            navigator.clipboard.writeText(content).then(() => {
                // 增加使用次数
                prompt.usageCount = (prompt.usageCount || 0) + 1;
                prompt.updatedAt = Date.now();
                saveData();
                renderPromptList();
                if (app.selectedPrompt === promptId) {
                    showPromptDetail(prompt);
                }
                closeVariableModal();
                showToast('内容已复制到剪贴板');
            });
        }

        // 关闭变量模态框
        function closeVariableModal() {
            document.getElementById('variableModal').classList.add('hidden');
        }

        // 提示词模态框操作
        function openPromptModal(promptId = null) {
            const modal = document.getElementById('promptModal');
            const title = document.getElementById('modalTitle');
            
            app.editingPrompt = promptId;
            
            if (promptId) {
                const prompt = app.prompts.find(p => p.id === promptId);
                if (prompt) {
                    title.textContent = '编辑提示词';
                    document.getElementById('promptTitle').value = prompt.title;
                    document.getElementById('promptContent').value = prompt.content;
                    document.getElementById('promptDescription').value = prompt.description || '';
                    document.getElementById('promptFavorite').checked = prompt.favorite || false;
                    renderSelectedTags(prompt.tags || []);
                }
            } else {
                title.textContent = '新建提示词';
                document.getElementById('promptTitle').value = '';
                document.getElementById('promptContent').value = '';
                document.getElementById('promptDescription').value = '';
                document.getElementById('promptFavorite').checked = false;
                renderSelectedTags([]);
            }
            
            modal.classList.remove('hidden');
        }

        function closePromptModal() {
            document.getElementById('promptModal').classList.add('hidden');
            app.editingPrompt = null;
        }

        function savePrompt() {
            const title = document.getElementById('promptTitle').value.trim();
            const content = document.getElementById('promptContent').value.trim();
            const description = document.getElementById('promptDescription').value.trim();
            const favorite = document.getElementById('promptFavorite').checked;
            
            if (!title || !content) {
                showToast('请填写标题和内容', 'error');
                return;
            }

            const selectedTags = Array.from(document.getElementById('selectedTags').querySelectorAll('.tag-chip')).map(chip => chip.dataset.tagId);

            if (app.editingPrompt) {
                // 编辑模式
                const prompt = app.prompts.find(p => p.id === app.editingPrompt);
                if (prompt) {
                    prompt.title = title;
                    prompt.content = content;
                    prompt.description = description;
                    prompt.favorite = favorite;
                    prompt.tags = selectedTags;
                    prompt.updatedAt = Date.now();
                }
            } else {
                // 新建模式
                const newPrompt = {
                    id: generateId(),
                    title,
                    content,
                    description,
                    tags: selectedTags,
                    favorite,
                    createdAt: Date.now(),
                    updatedAt: Date.now(),
                    usageCount: 0
                };
                app.prompts.push(newPrompt);
            }

            saveData();
            renderPromptList();
            closePromptModal();
            showToast(app.editingPrompt ? '提示词已更新' : '提示词已创建');
        }

        // 编辑提示词
        function editPrompt(promptId) {
            openPromptModal(promptId);
        }

        // 删除提示词
        function deletePrompt(promptId) {
            if (confirm('确定要删除这个提示词吗？')) {
                app.prompts = app.prompts.filter(p => p.id !== promptId);
                saveData();
                renderPromptList();
                if (app.selectedPrompt === promptId) {
                    closePromptDetail();
                }
                showToast('提示词已删除');
            }
        }

        // 标签管理
        function openTagModal(tagId = null) {
            const modal = document.getElementById('tagModal');
            const title = document.getElementById('tagModalTitle');
            const parentSelect = document.getElementById('parentTag');
            
            app.editingTag = tagId;
            
            // 更新父级标签选项
            parentSelect.innerHTML = '<option value="">无（顶级标签）</option>';
            app.tags.forEach(tag => {
                if (tag.id !== tagId) { // 不能选择自己作为父级
                    parentSelect.innerHTML += `<option value="${tag.id}">${'  '.repeat(tag.level)}${tag.name}</option>`;
                }
            });
            
            if (tagId) {
                const tag = app.tags.find(t => t.id === tagId);
                if (tag) {
                    title.textContent = '编辑标签';
                    document.getElementById('tagName').value = tag.name;
                    document.getElementById('parentTag').value = tag.parentId || '';
                }
            } else {
                title.textContent = '新建标签';
                document.getElementById('tagName').value = '';
                document.getElementById('parentTag').value = '';
            }
            
            modal.classList.remove('hidden');
        }

        function closeTagModal() {
            document.getElementById('tagModal').classList.add('hidden');
            app.editingTag = null;
        }

        function saveTag() {
            const name = document.getElementById('tagName').value.trim();
            const parentId = document.getElementById('parentTag').value || null;
            
            if (!name) {
                showToast('请输入标签名称', 'error');
                return;
            }

            // 检查重名
            const existing = app.tags.find(t => t.name === name && t.id !== app.editingTag);
            if (existing) {
                showToast('标签名称已存在', 'error');
                return;
            }

            const level = parentId ? (app.tags.find(t => t.id === parentId)?.level || 0) + 1 : 0;

            if (app.editingTag) {
                // 编辑模式
                const tag = app.tags.find(t => t.id === app.editingTag);
                if (tag) {
                    tag.name = name;
                    tag.parentId = parentId;
                    tag.level = level;
                    // 更新子标签的层级
                    updateChildTagLevels(tag.id);
                }
            } else {
                // 新建模式
                const newTag = {
                    id: generateId(),
                    name,
                    parentId,
                    level
                };
                app.tags.push(newTag);
            }

            saveData();
            renderTagTree();
            closeTagModal();
            showToast(app.editingTag ? '标签已更新' : '标签已创建');
        }

        function updateChildTagLevels(parentId) {
            const children = app.tags.filter(t => t.parentId === parentId);
            const parentLevel = app.tags.find(t => t.id === parentId)?.level || 0;
            
            children.forEach(child => {
                child.level = parentLevel + 1;
                updateChildTagLevels(child.id);
            });
        }

        function editTag(tagId) {
            openTagModal(tagId);
        }

        function deleteTag(tagId) {
            const tag = app.tags.find(t => t.id === tagId);
            if (!tag) return;

            const hasChildren = app.tags.some(t => t.parentId === tagId);
            const hasPrompts = app.prompts.some(p => p.tags && p.tags.includes(tagId));

            let message = '确定要删除这个标签吗？';
            if (hasChildren) {
                message += '\n注意：子标签也会被删除。';
            }
            if (hasPrompts) {
                message += '\n注意：相关提示词的标签会被移除。';
            }

            if (confirm(message)) {
                // 删除标签及其子标签
                function deleteTagAndChildren(tagId) {
                    app.tags = app.tags.filter(t => t.id !== tagId);
                    const children = app.tags.filter(t => t.parentId === tagId);
                    children.forEach(child => deleteTagAndChildren(child.id));
                }

                deleteTagAndChildren(tagId);

                // 从提示词中移除标签
                app.prompts.forEach(prompt => {
                    if (prompt.tags) {
                        prompt.tags = prompt.tags.filter(t => t !== tagId);
                    }
                });

                saveData();
                renderTagTree();
                renderPromptList();
                showToast('标签已删除');
            }
        }

        // 标签选择器
        function showTagSelector() {
            const container = document.getElementById('selectedTags');
            const selectedTagIds = Array.from(container.querySelectorAll('.tag-chip')).map(chip => chip.dataset.tagId);
            
            const availableTags = app.tags.filter(tag => !selectedTagIds.includes(tag.id));
            
            if (availableTags.length === 0) {
                showToast('没有更多标签可选择', 'info');
                return;
            }

            const select = document.createElement('select');
            select.className = 'w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700';
            select.innerHTML = '<option value="">选择标签...</option>' + 
                availableTags.map(tag => `<option value="${tag.id}">${'  '.repeat(tag.level)}${tag.name}</option>`).join('');
            
            select.addEventListener('change', (e) => {
                if (e.target.value) {
                    addTagToPrompt(e.target.value);
                    e.target.remove();
                }
            });

            container.appendChild(select);
            select.focus();
        }

        function addTagToPrompt(tagId) {
            const tag = app.tags.find(t => t.id === tagId);
            if (!tag) return;

            const container = document.getElementById('selectedTags');
            const chip = document.createElement('span');
            chip.className = 'tag-chip inline-flex items-center gap-1 px-2 py-1 bg-primary text-white text-xs rounded-full';
            chip.dataset.tagId = tagId;
            chip.innerHTML = `
                ${tag.name}
                <button type="button" onclick="this.parentElement.remove()" class="hover:bg-white hover:bg-opacity-20 rounded-full p-0.5">
                    <i data-lucide="x" class="w-3 h-3"></i>
                </button>
            `;
            
            container.appendChild(chip);
            lucide.createIcons();
        }

        function renderSelectedTags(tagIds) {
            const container = document.getElementById('selectedTags');
            container.innerHTML = '';
            
            tagIds.forEach(tagId => {
                const tag = app.tags.find(t => t.id === tagId);
                if (tag) {
                    addTagToPrompt(tagId);
                }
            });
        }

        // 编辑/预览切换功能
        function showEditPanel() {
            document.getElementById('editTab').className = 'px-4 py-2 text-sm font-medium text-primary border-b-2 border-primary bg-gray-50 dark:bg-gray-700';
            document.getElementById('previewTab').className = 'px-4 py-2 text-sm font-medium text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-gray-200';
            document.getElementById('editPanel').classList.remove('hidden');
            document.getElementById('previewPanel').classList.add('hidden');
        }

        function showPreviewPanel() {
            document.getElementById('previewTab').className = 'px-4 py-2 text-sm font-medium text-primary border-b-2 border-primary bg-gray-50 dark:bg-gray-700';
            document.getElementById('editTab').className = 'px-4 py-2 text-sm font-medium text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-gray-200';
            document.getElementById('editPanel').classList.add('hidden');
            document.getElementById('previewPanel').classList.remove('hidden');
            updateMarkdownPreview();
        }

        function updateMarkdownPreview() {
            const content = document.getElementById('promptContent').value;
            const preview = document.getElementById('markdownPreview');
            
            if (!content.trim()) {
                preview.innerHTML = '<p class="text-gray-500 italic">暂无内容预览</p>';
                return;
            }

            try {
                // 先处理变量高亮，再进行Markdown渲染
                const processedContent = content.replace(/\{\{([^}]+)\}\}/g, '<mark class="variable-highlight">{{$1}}</mark>');
                const rendered = marked.parse(processedContent);
                preview.innerHTML = rendered;
            } catch (error) {
                preview.innerHTML = '<p class="text-red-500">预览渲染失败</p>';
                console.error('Markdown渲染错误:', error);
            }
        }

        // 渲染Markdown内容（用于详情显示）
        function renderMarkdownContent(content) {
            try {
                const processedContent = content.replace(/\{\{([^}]+)\}\}/g, '<mark class="variable-highlight">{{$1}}</mark>');
                return marked.parse(processedContent);
            } catch (error) {
                console.error('Markdown渲染错误:', error);
                return highlightVariables(content);
            }
        }

        // 导入导出功能
        function openExportModal() {
            const modal = document.getElementById('exportModal');
            const filteredCount = document.getElementById('filteredCount');
            
            // 更新筛选结果数量
            const filtered = filterPrompts();
            filteredCount.textContent = `${filtered.length} 个提示词`;
            
            modal.classList.remove('hidden');
        }

        function closeExportModal() {
            document.getElementById('exportModal').classList.add('hidden');
        }

        function performExport() {
            const format = document.querySelector('input[name="exportFormat"]:checked').value;
            const scope = document.querySelector('input[name="exportScope"]:checked').value;
            
            let data = {};
            
            // 准备导出数据
            switch (scope) {
                case 'all':
                    data = {
                        prompts: app.prompts,
                        tags: app.tags,
                        exportedAt: new Date().toISOString(),
                        version: '1.0'
                    };
                    break;
                case 'prompts':
                    data = {
                        prompts: app.prompts,
                        tags: [],
                        exportedAt: new Date().toISOString(),
                        version: '1.0'
                    };
                    break;
                case 'filtered':
                    const filteredPrompts = filterPrompts();
                    const usedTagIds = new Set();
                    filteredPrompts.forEach(p => {
                        if (p.tags) {
                            p.tags.forEach(tagId => usedTagIds.add(tagId));
                        }
                    });
                    const usedTags = app.tags.filter(t => usedTagIds.has(t.id));
                    data = {
                        prompts: filteredPrompts,
                        tags: usedTags,
                        exportedAt: new Date().toISOString(),
                        version: '1.0'
                    };
                    break;
            }
            
            // 生成文件
            if (format === 'json') {
                exportAsJSON(data, scope);
            } else {
                exportAsMarkdown(data, scope);
            }
            
            closeExportModal();
            showToast('导出成功');
        }

        function exportAsJSON(data, scope) {
            const filename = `prompthub-${scope}-${new Date().toISOString().split('T')[0]}.json`;
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            downloadFile(blob, filename);
        }

        function exportAsMarkdown(data, scope) {
            let markdown = `# PromptHub 导出\n\n`;
            markdown += `**导出时间：** ${new Date().toLocaleString()}\n`;
            markdown += `**导出范围：** ${scope === 'all' ? '全部数据' : scope === 'prompts' ? '仅提示词' : '筛选结果'}\n`;
            markdown += `**提示词数量：** ${data.prompts.length}\n`;
            markdown += `**标签数量：** ${data.tags.length}\n\n`;
            
            if (data.tags.length > 0) {
                markdown += `## 标签结构\n\n`;
                const rootTags = data.tags.filter(t => !t.parentId);
                
                function renderTagMarkdown(tag, level = 0) {
                    const indent = '  '.repeat(level);
                    const promptCount = data.prompts.filter(p => p.tags && p.tags.includes(tag.id)).length;
                    markdown += `${indent}- **${tag.name}** (${promptCount} 个提示词)\n`;
                    
                    const children = data.tags.filter(t => t.parentId === tag.id);
                    children.forEach(child => renderTagMarkdown(child, level + 1));
                }
                
                rootTags.forEach(tag => renderTagMarkdown(tag));
                markdown += `\n`;
            }
            
            markdown += `## 提示词列表\n\n`;
            
            data.prompts.forEach((prompt, index) => {
                markdown += `### ${index + 1}. ${prompt.title}\n\n`;
                
                if (prompt.description) {
                    markdown += `**描述：** ${prompt.description}\n\n`;
                }
                
                if (prompt.tags && prompt.tags.length > 0) {
                    const tagNames = prompt.tags.map(tagId => {
                        const tag = data.tags.find(t => t.id === tagId);
                        return tag ? tag.name : tagId;
                    });
                    markdown += `**标签：** ${tagNames.join(', ')}\n\n`;
                }
                
                markdown += `**内容：**\n\n`;
                markdown += `\`\`\`\n${prompt.content}\n\`\`\`\n\n`;
                
                markdown += `**统计信息：**\n`;
                markdown += `- 创建时间：${new Date(prompt.createdAt).toLocaleString()}\n`;
                markdown += `- 更新时间：${new Date(prompt.updatedAt).toLocaleString()}\n`;
                markdown += `- 使用次数：${prompt.usageCount || 0}\n`;
                markdown += `- 收藏状态：${prompt.favorite ? '是' : '否'}\n\n`;
                markdown += `---\n\n`;
            });
            
            const filename = `prompthub-${scope}-${new Date().toISOString().split('T')[0]}.md`;
            const blob = new Blob([markdown], { type: 'text/markdown' });
            downloadFile(blob, filename);
        }

        function downloadFile(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // 导入功能
        function openImportModal() {
            const modal = document.getElementById('importModal');
            clearSelectedFile();
            modal.classList.remove('hidden');
            lucide.createIcons();
        }

        function closeImportModal() {
            document.getElementById('importModal').classList.add('hidden');
            clearSelectedFile();
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            if (file.type !== 'application/json' && !file.name.endsWith('.json')) {
                showToast('请选择JSON格式的文件', 'error');
                return;
            }
            
            document.getElementById('fileName').textContent = file.name;
            document.getElementById('selectedFile').classList.remove('hidden');
            document.getElementById('importOptions').classList.remove('hidden');
            
            // 读取文件预览
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (validateImportData(data)) {
                        showImportPreview(data);
                        document.getElementById('confirmImportBtn').disabled = false;
                    } else {
                        showToast('文件格式不正确', 'error');
                        clearSelectedFile();
                    }
                } catch (error) {
                    showToast('文件解析失败', 'error');
                    clearSelectedFile();
                }
            };
            reader.readAsText(file);
        }

        function clearSelectedFile() {
            document.getElementById('importFileInput').value = '';
            document.getElementById('selectedFile').classList.add('hidden');
            document.getElementById('importOptions').classList.add('hidden');
            document.getElementById('importPreview').classList.add('hidden');
            document.getElementById('confirmImportBtn').disabled = true;
        }

        function validateImportData(data) {
            // 检查基本结构
            if (!data || typeof data !== 'object') return false;
            if (!Array.isArray(data.prompts)) return false;
            if (!Array.isArray(data.tags)) return false;
            
            // 检查提示词结构
            for (const prompt of data.prompts) {
                if (!prompt.id || !prompt.title || !prompt.content) return false;
                if (typeof prompt.id !== 'string') return false;
                if (typeof prompt.title !== 'string') return false;
                if (typeof prompt.content !== 'string') return false;
            }
            
            // 检查标签结构
            for (const tag of data.tags) {
                if (!tag.id || !tag.name) return false;
                if (typeof tag.id !== 'string') return false;
                if (typeof tag.name !== 'string') return false;
            }
            
            return true;
        }

        function showImportPreview(data) {
            document.getElementById('previewPrompts').textContent = data.prompts.length;
            document.getElementById('previewTags').textContent = data.tags.length;
            document.getElementById('importPreview').classList.remove('hidden');
        }

        function performImport() {
            const file = document.getElementById('importFileInput').files[0];
            const strategy = document.querySelector('input[name="importStrategy"]:checked').value;
            
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    
                    if (strategy === 'replace') {
                        // 替换模式：清空现有数据
                        app.prompts = [];
                        app.tags = [];
                    }
                    
                    // 导入标签
                    const tagIdMapping = {}; // 旧ID -> 新ID的映射
                    data.tags.forEach(importTag => {
                        // 检查是否存在重名标签
                        const existingTag = app.tags.find(t => t.name === importTag.name && t.parentId === importTag.parentId);
                        
                        if (existingTag && strategy === 'merge') {
                            // 合并模式下，使用现有标签
                            tagIdMapping[importTag.id] = existingTag.id;
                        } else {
                            // 创建新标签
                            const newId = generateId();
                            tagIdMapping[importTag.id] = newId;
                            
                            const newTag = {
                                ...importTag,
                                id: newId
                            };
                            
                            app.tags.push(newTag);
                        }
                    });
                    
                    // 更新标签的parentId引用
                    app.tags.forEach(tag => {
                        if (tag.parentId && tagIdMapping[tag.parentId]) {
                            tag.parentId = tagIdMapping[tag.parentId];
                        }
                    });
                    
                    // 导入提示词
                    data.prompts.forEach(importPrompt => {
                        // 检查是否存在相同标题的提示词
                        const existingPrompt = app.prompts.find(p => p.title === importPrompt.title);
                        
                        if (existingPrompt && strategy === 'merge') {
                            // 合并模式下，更新现有提示词
                            existingPrompt.content = importPrompt.content;
                            existingPrompt.description = importPrompt.description;
                            existingPrompt.favorite = importPrompt.favorite;
                            existingPrompt.tags = importPrompt.tags ? importPrompt.tags.map(tagId => tagIdMapping[tagId] || tagId) : [];
                            existingPrompt.updatedAt = Date.now();
                        } else {
                            // 创建新提示词
                            const newPrompt = {
                                ...importPrompt,
                                id: generateId(),
                                tags: importPrompt.tags ? importPrompt.tags.map(tagId => tagIdMapping[tagId] || tagId) : [],
                                createdAt: Date.now(),
                                updatedAt: Date.now()
                            };
                            
                            app.prompts.push(newPrompt);
                        }
                    });
                    
                    // 保存数据并更新界面
                    saveData();
                    renderTagTree();
                    renderPromptList();
                    closeImportModal();
                    
                    showToast(`成功导入 ${data.prompts.length} 个提示词和 ${data.tags.length} 个标签`);
                    
                } catch (error) {
                    showToast('导入失败：' + error.message, 'error');
                }
            };
            reader.readAsText(file);
        }

        // 视图切换功能
        function toggleViewMode() {
            app.viewMode = app.viewMode === 'grid' ? 'compact' : 'grid';
            updateViewToggleButton();
            updatePromptListLayout();
            renderPromptList();
        }

        function updateViewToggleButton() {
            const viewToggle = document.getElementById('viewToggle');
            const icon = viewToggle.querySelector('i');
            
            if (app.viewMode === 'grid') {
                icon.setAttribute('data-lucide', 'layout-grid');
                viewToggle.title = '切换到紧凑视图';
            } else {
                icon.setAttribute('data-lucide', 'grid-3x3');
                viewToggle.title = '切换到网格视图';
            }
            lucide.createIcons();
        }

        function updatePromptListLayout() {
            const promptList = document.getElementById('promptList');
            if (app.viewMode === 'compact') {
                promptList.className = 'grid gap-3 compact-layout';
            } else {
                promptList.className = 'grid gap-4 grid-layout';
            }
        }

        // 深色模式切换
        function toggleTheme() {
            const currentTheme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
            
            if (currentTheme === 'dark') {
                document.documentElement.classList.remove('dark');
                app.theme = 'light';
            } else {
                document.documentElement.classList.add('dark');
                app.theme = 'dark';
            }
            
            // 保存主题偏好
            localStorage.setItem('prompthub_theme', app.theme);
            
            // 更新图标
            updateThemeIcon();
        }

        function updateThemeIcon() {
            const isDark = document.documentElement.classList.contains('dark');
            const sunIcon = document.querySelector('#themeToggle i[data-lucide="sun"]');
            const moonIcon = document.querySelector('#themeToggle i[data-lucide="moon"]');
            
            if (isDark) {
                sunIcon?.classList.add('hidden');
                moonIcon?.classList.remove('hidden');
            } else {
                sunIcon?.classList.remove('hidden');
                moonIcon?.classList.add('hidden');
            }
        }

        // 快捷键支持
        function handleKeyboardShortcuts(e) {
            // 如果在输入框中，跳过某些快捷键
            const isInputFocused = ['INPUT', 'TEXTAREA'].includes(e.target.tagName);
            
            // Ctrl/Cmd + N - 新建提示词
            if ((e.ctrlKey || e.metaKey) && e.key === 'n' && !isInputFocused) {
                e.preventDefault();
                openPromptModal();
                showToast('快捷键: Ctrl+N 新建提示词', 'info');
            }
            
            // Ctrl/Cmd + K - 聚焦搜索框
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                document.getElementById('searchInput').focus();
                showToast('快捷键: Ctrl+K 搜索', 'info');
            }
            
            // Escape - 关闭模态框
            if (e.key === 'Escape') {
                const modals = [
                    'promptModal', 'tagModal', 'variableModal', 
                    'exportModal', 'importModal'
                ];
                
                modals.forEach(modalId => {
                    const modal = document.getElementById(modalId);
                    if (!modal.classList.contains('hidden')) {
                        modal.classList.add('hidden');
                        e.preventDefault();
                    }
                });
                
                // 关闭详情面板
                if (!document.getElementById('rightPanel').classList.contains('hidden')) {
                    closePromptDetail();
                    e.preventDefault();
                }
            }
            
            // Ctrl/Cmd + D - 切换深色模式
            if ((e.ctrlKey || e.metaKey) && e.key === 'd' && !isInputFocused) {
                e.preventDefault();
                toggleTheme();
                showToast('快捷键: Ctrl+D 切换主题', 'info');
            }
            
            // Ctrl/Cmd + G - 切换视图模式
            if ((e.ctrlKey || e.metaKey) && e.key === 'g' && !isInputFocused) {
                e.preventDefault();
                toggleViewMode();
                showToast(`快捷键: Ctrl+G 切换到${app.viewMode === 'grid' ? '网格' : '紧凑'}视图`, 'info');
            }
            
            // F - 筛选收藏夹 (仅在非输入状态)
            if (e.key === 'f' && !isInputFocused && !e.ctrlKey && !e.metaKey) {
                e.preventDefault();
                app.currentFilter = 'favorites';
                document.querySelectorAll('.quick-filter').forEach(b => b.classList.remove('active'));
                document.querySelector('.quick-filter[data-filter="favorites"]').classList.add('active');
                renderPromptList();
                showToast('快捷键: F 收藏夹', 'info');
            }
            
            // R - 筛选最近使用 (仅在非输入状态)
            if (e.key === 'r' && !isInputFocused && !e.ctrlKey && !e.metaKey) {
                e.preventDefault();
                app.currentFilter = 'recent';
                document.querySelectorAll('.quick-filter').forEach(b => b.classList.remove('active'));
                document.querySelector('.quick-filter[data-filter="recent"]').classList.add('active');
                renderPromptList();
                showToast('快捷键: R 最近使用', 'info');
            }
        }

        // 搜索高亮
        function highlightSearchTerm(text, searchTerm) {
            if (!searchTerm) return text;
            
            const regex = new RegExp(`(${searchTerm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
            return text.replace(regex, '<mark class="bg-yellow-200 dark:bg-yellow-800 px-1 rounded">$1</mark>');
        }

        // 加载状态管理
        function setLoading(isLoading) {
            app.isLoading = isLoading;
            const loadingElements = document.querySelectorAll('.loading-indicator');
            
            if (isLoading) {
                loadingElements.forEach(el => el.classList.remove('hidden'));
            } else {
                loadingElements.forEach(el => el.classList.add('hidden'));
            }
        }

        // 初始化主题
        function initTheme() {
            const savedTheme = localStorage.getItem('prompthub_theme');
            
            if (savedTheme) {
                app.theme = savedTheme;
                if (savedTheme === 'dark') {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }
            
            updateThemeIcon();
        }

        // 工具函数
        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2);
        }

        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `fixed top-4 right-4 px-4 py-2 rounded-lg text-white z-50 ${
                type === 'error' ? 'bg-red-500' : 
                type === 'info' ? 'bg-blue-500' : 'bg-green-500'
            }`;
            toast.textContent = message;
            
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        // 显示快捷键提示
        function showKeyboardShortcuts() {
            const shortcuts = [
                { key: 'Ctrl+N', action: '新建提示词' },
                { key: 'Ctrl+K', action: '搜索聚焦' },
                { key: 'Ctrl+D', action: '切换主题' },
                { key: 'Ctrl+G', action: '切换视图' },
                { key: 'F', action: '收藏夹' },
                { key: 'R', action: '最近使用' },
                { key: 'ESC', action: '关闭弹窗' }
            ];

            const shortcutModal = document.createElement('div');
            shortcutModal.className = 'fixed inset-0 bg-black bg-opacity-30 z-50 flex items-center justify-center p-4';
            shortcutModal.innerHTML = `
                <div class="glass-morphism bg-white dark:bg-gray-800 rounded-xl p-6 max-w-md w-full">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-lg font-semibold text-gray-900 dark:text-gray-100">快捷键提示</h3>
                        <button onclick="this.closest('.fixed').remove()" class="p-1 hover:bg-gray-200 dark:hover:bg-gray-700 rounded">
                            <i data-lucide="x" class="w-4 h-4"></i>
                        </button>
                    </div>
                    <div class="space-y-2 mb-4">
                        ${shortcuts.map(s => `
                            <div class="flex items-center justify-between py-1">
                                <span class="text-sm text-gray-600 dark:text-gray-400">${s.action}</span>
                                <kbd class="px-2 py-1 bg-gray-100 dark:bg-gray-700 text-xs rounded border">${s.key}</kbd>
                            </div>
                        `).join('')}
                    </div>
                    <p class="text-xs text-gray-500 dark:text-gray-400 text-center">
                        💡 这些快捷键能帮你更高效地使用PromptHub
                    </p>
                </div>
            `;

            document.body.appendChild(shortcutModal);
            lucide.createIcons();

            // 5秒后自动关闭
            setTimeout(() => {
                if (shortcutModal.parentNode) {
                    shortcutModal.remove();
                }
            }, 8000);
        }

        // 启动应用
        document.addEventListener('DOMContentLoaded', initApp);
    </script>


</body></html>
